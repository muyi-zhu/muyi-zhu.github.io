<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <title>{{TITLE}}</title>
  <link rel="icon" href="{{ROOT}}icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ROOT}}assets/styles/site.css">
  <link rel="preload" href="{{ROOT}}fonts/schibsted-grotesk-0.woff2" as="font" type="font/woff2" crossorigin>
  <script src="{{ROOT}}assets/scripts/main.js" defer></script>
</head>
<body class="{{BODY_CLASS}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell {{SHELL_CLASS}}">
    {{NAV}}
    {{CONTENT}}
    {{FOOTER}}
  </div>
  {{LIGHTBOX}}
  <button class="back-to-top" type="button" aria-label="Back to top" hidden>↑</button>
</body>
</html>
